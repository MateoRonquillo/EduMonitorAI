name: edumonitorai

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configurar POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configurar POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  moodle-integration:
    build:
      context: ../..
      dockerfile: infra/docker/MoodleIntegration.Dockerfile
    image: edumonitorai-moodle:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:5101:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Moodle__BaseUrl: ${MOODLE_BASE_URL:-}
      Moodle__Token: ${MOODLE_API_TOKEN:-}
      Identity__Authority: ${IDENTITY_AUTHORITY:-}
      Identity__Audience: ${IDENTITY_AUDIENCE:-}

    networks:
      - backend

  academic-data:
    build:
      context: ../..
      dockerfile: infra/docker/AcademicData.Dockerfile
    image: edumonitorai-academic:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:5102:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    networks:
      - backend

  access:
    build:
      context: ../..
      dockerfile: infra/docker/Access.Dockerfile
    image: edumonitorai-access:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:5103:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    networks:
      - backend

  moodle_app:
    image: bitnamilegacy/moodle:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - MOODLE_DATABASE_HOST=moodle_db
      - MOODLE_DATABASE_USER=moodle_user
      - MOODLE_DATABASE_PASSWORD=EduMonitor2026_db!
      - MOODLE_DATABASE_NAME=moodle_db
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=EduMonitor2026!
    depends_on:
      - moodle_db
    networks:
      - backend

  moodle_db:
    image: mariadb:10.11
    environment:
      - MARIADB_ROOT_PASSWORD=EduMonitor2026_root!
      - MARIADB_USER=moodle_user
      - MARIADB_PASSWORD=EduMonitor2026_db!
      - MARIADB_DATABASE=moodle_db
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge