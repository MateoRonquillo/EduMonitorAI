name: CI - Validacion inicial

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validar-repositorio:
    name: Verificar estructura y configuracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura base
        run: |
          test -f backend/EduMonitorAI.sln
          test -f infra/.env.example
          test -f docs/gitflow.md
          test -d infra/docker
          test -d infra/compose

      - name: Verificar archivos de entorno
        run: |
          archivos=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)

          if [ -n "$archivos" ]; then
            echo "::error::Se encontraron archivos de entorno versionados"
            echo "$archivos"
            exit 1
          fi